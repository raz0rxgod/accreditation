events {}

http {
    client_max_body_size 25M; # под загрузку сканов документов

    # Замените your-domain.example на ваш реальный домен во всех трёх server_name ниже
    # (проще всего: sed -i 's/your-domain.example/ваш-домен.ru/g' nginx/nginx.conf)

    # --- 80: редирект на https + ACME-challenge для certbot ---
    server {
        listen 80;
        server_name your-domain.example;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- 443: сайт (frontend) ---
    server {
        listen 443 ssl;
        server_name your-domain.example;

        ssl_certificate     /etc/nginx/certs/live/your-domain.example/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/your-domain.example/privkey.pem;

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- 8443: backend REST API + WebSocket-чат ---
    # Отдельный порт, а не location /api/, — чтобы не переписывать префиксы путей
    # в NestJS (роуты вида /auth/login, /applications и т.д. идут как есть).
    server {
        listen 8443 ssl;
        server_name your-domain.example;

        ssl_certificate     /etc/nginx/certs/live/your-domain.example/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/your-domain.example/privkey.pem;

        location / {
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Нужно для WebSocket-чата (Socket.IO namespace /chat)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # --- 9443: MinIO — подписанные ссылки на файлы (фото, документы, бейджи) ---
    server {
        listen 9443 ssl;
        server_name your-domain.example;

        ssl_certificate     /etc/nginx/certs/live/your-domain.example/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/your-domain.example/privkey.pem;

        location / {
            proxy_pass http://minio:9000;
            # ВАЖНО: именно $http_host (с портом), а не $host — подписанные ссылки
            # (SigV4) считают подпись с учётом Host:порт, на который они были
            # выписаны (S3_PUBLIC_ENDPOINT:S3_PUBLIC_PORT в backend/.env). Если тут
            # будет $host без порта — подпись не совпадёт, MinIO ответит 403.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Официальная рекомендация MinIO для reverse-proxy — отключить буферизацию
            # (иначе большие файлы/аплоады могут обрываться или тормозить).
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
